spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/opsflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 2s

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:720000000}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
