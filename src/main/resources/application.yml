server:
  port: 8080

spring:
  application:
    name: opsflow

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  flyway:
    baseline-on-migrate: false
    baseline-version: 1

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

opsflow:
  ticket:
    sla:
      scan-delay-ms: 300000

jwt:
  expiration: ${JWT_EXPIRATION:720000000}

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never