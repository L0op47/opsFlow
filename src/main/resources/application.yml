server:
  port: 8080

spring:
  application:
    name: opsflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    baseline-on-migrate: false
    baseline-version: 1

opsflow:
  ticket:
    sla:
      scan-delay-ms: 300000

jwt:
  expiration: ${JWT_EXPIRATION:720000000}

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never